name=Salatbladskimmel
description=<p>Modellen beregner om det er fare for infeksjon av salatbladskimmel (Bremia lactucae) basert p&aring; v&aelig;rdata og v&aelig;rprognoser. Varslene gjelder for salat som dyrkes uten dekke p&aring; friland, forutsatt at smitte og mottakelige vertplanter finnes i omr&aring;det.</p> <p>Salatbladskimmel opptrer vanligvis p&aring; sensommeren i perioder med mye fuktighet og duggfall, men er ikke &aring;rviss i alle omr&aring;der med salatproduksjon. Det er derfor viktig &aring; vurdere om det er reell fare for smitte, selv om det g&aring;r ut varsler om fare for infeksjon.</p> <p>{{filename="/images/salatbladskimmel.jpg" description="Salatbladskimmel i isbergsalat. (Foto: Erling Fl&oslash;istad, NIBIO)"}}<br /> {{filename="/images/salatbladskimmel_2.jpg" description="Salatbladskimmel i isbergsalat. (Foto: Erling Fl&oslash;istad, NIBIO)"}}<br /> <em>Salatbladskimmel i isbergsalat. (Foto: Erling Fl&oslash;istad, NIBIO)</em></p> <p>Varslingsmodellen for salatbladskimmel er basert p&aring; patogenets biologi og respons p&aring; ulike v&aelig;rforhold. Varsler beregnes med utgangspunkt i timeverdier for relativ luftfuktighet, bladfuktighet, temperatur og globalstr&aring;ling. Bladfuktighet m&aring;les fortrinnsvis p&aring; bakkeniv&aring; (30cm), men m&aring;linger ved 2 m brukes der sensor p&aring; bakkeniv&aring; ikke finnes. V&aelig;rdata hentes fra v&aelig;rstasjoner tilknyttet <a href="https://lmt.nibio.no" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste</a> (LMT) og 2-d&oslash;gns v&aelig;rprognoser fra <a href="https://met.no" target="_blank" rel="noopener">Meteorologisk Institutt</a>.</p> <p>Modellen beregner om det er forhold for sporulering, infeksjon og eventuelt mislykket infeksjon.</p> <p>Sporulering beregnes ved h&oslash;y relativ luftfuktighet (&ge; 93%) i minst 4 timer n&aring;r det er m&oslash;rkt. Sporene slippes ved soloppgang, og spres med vind og vannsprut. En p&aring;f&oslash;lgende infeksjon krever fritt vann p&aring; bladene, og forutsetter minst 3 timer sammenhengende med bladfukt i l&oslash;pet av dagen eller p&aring;f&oslash;lgende natt. Det gis et r&oslash;dt varsel om risiko for infeksjon n&aring;r kriteriene for sporulering og infeksjon er oppfylt. H&oslash;ye temperaturer (&gt; 27&deg;C) vil hemme bladskimmelens evne til &aring; utvikle seg, og dermed eliminere et potensielt risikovarsel det p&aring;f&oslash;lgende d&oslash;gnet.</p> <p>Mislykket infeksjon beregnes dersom det er perioder med bladfukt som varer mindre enn 3 timer. Dette medf&oslash;rer at sporene begynner &aring; spire, men ikke rekker &aring; infisere f&oslash;r de t&oslash;rker. I slike tilfeller gis det IKKE varsel, selv om det skulle oppst&aring; en periode med bladfuktighet over 3 timer senere samme dag eller p&aring;f&oslash;lgende natt.</p> <h2>Tolking av varsel</h2> <p>R&oslash;dt varsel betyr at det er beregnet fare for angrep av salatbladskimmel, forutsatt at smitte og mottakelig vertplante finnes i omr&aring;det. Gr&oslash;nt betyr at det ikke er beregnet fare for angrep.</p> <p>Modellberegninger oppdateres daglig basert p&aring; registrerte v&aelig;rdata frem til dagens dato og 2-d&oslash;gns v&aelig;rprognoser.</p> <p>{{filename="/images/chart_BREMIALACT.png" description="Skjermdump fra detaljert varselvisning for salatbladskimmel. Grafen viser terskel for maksimumstemperatur for infeksjon (gul horisontal linje) og registrert maksimums-temperatur. Søyler i grafen gjenspeiler når de ulike kriteriene for sporulering og infeksjon er oppfylt. Bakgrunnsfargen i grafen er grønn når det ikke er fare for angrep og rød når det er beregnet infeksjonsrisiko."}}<br/> <em>Skjermdump fra detaljert varselvisning for salatbladskimmel. Grafen viser terskel for maksimumstemperatur for infeksjon (gul horisontal linje) og registrert maksimums-temperatur. S&oslash;yler i grafen gjenspeiler n&aring;r de ulike kriteriene for sporulering og infeksjon er oppfylt. Bakgrunnsfargen i grafen er gr&oslash;nn n&aring;r det ikke er fare for angrep og r&oslash;d n&aring;r det er beregnet infeksjonsrisiko.</em></p> <h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2> <p>Modellen er knyttet til en rekke v&aelig;rstasjoner i omr&aring;der med produksjon av salat. Varsler startes 1. juni og avsluttes 30 september. Ta kontakt med VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) ved &oslash;nske om at modellen skal settes opp for flere v&aelig;rstasjoner, eller ved behov for justert driftsperiode i sesong. Varsler vises automatisk i kartfunksjonen i VIPS-forsida for alle v&aelig;rstasjoner hvor modellen er startet. Modellen kan ogs&aring; settes opp som et privat varsel med egendefinert start og sluttdato. Dette kan gj&oslash;res for private v&aelig;rstasjoner og for v&aelig;rstasjoner som allerede finnes i LMT-databasen. Se <a href="https://www.vips-landbruk.no/information/27/" target="_blank" rel="noopener">brukerveiledning </a></p> <h2>Utpr&oslash;ving og validering av modellen</h2> <p>Varslingsmodellen som tilbys i VIPS er justert og tilpasset norske forhold, med utgangspunkt i en modell som opprinnelig ble utviklet for salatprodusenter i California (Scherm &amp; van Bruggen, 1994, 1995), Modell-Analys som ble tilpasset for bruk i Sverige (Forsberg, 2000), og videre studier i California (Wu et al, 2002)</p> <p>I perioden 2001-2005 ble modellen testet og tilpasset norske forhold, og har v&aelig;rt tilgjengelig i VIPS siden 2005. Resultatene viste god sammenheng mellom fangst i sporefeller og beregnet sporulering, med (78 % korrekte varsler) basert p&aring; totalt 59 dager med sporefangst i &aring;ker med bladskimmelsmitte. Dette arbeidet var del av et PhD-studie (Nordskog 2006).</p> <h2>Anbefaling om bruk av modellen</h2> <p>Ved varsel om fare for infeksjon av salatbladskimmel b&oslash;r spr&oslash;yting vurderes ut fra smittepress og tidspunkt for forrige behandling. Ta kontakt med lokal r&aring;dgiver i NLR for vurdering av aktuelle plantevernstrategier.</p> <h2>Referanser</h2> <p>Forsberg, A. 2000. Prognossystem f&ouml;r behovsanpassad bek&auml;mpning av sallatsbladm&ouml;gel. [Forecasting systems for timing fungicide treatments of downy mildew in lettuce]. (In Swedish, English summary). &ndash; V&auml;xtskyddsnotiser 64: 44-47.</p> <p>Scherm, H. &amp; van Bruggen, A.H.C. 1994. Weather variables associated with infection of lettuce by downy mildew (Bremia lactucae) in Coastal California. &ndash; Phytopathology 84: 860- 865.</p> <p>Scherm, H. &amp; van Bruggen, A.H.C. 1995. Concurrent spore release and infection by Bremia lactucae during mornings with prolonged leaf wetness. &ndash; Phytopathology 85: 552-555.</p> <p>Wu, B.M., van Bruggen, A.H.C., Subbarao, K.U. &amp; Scherm. H. 2002. Incorporation of temperature and solar radiation thresholds to modify a lettuce downy mildew warning system. &ndash; Phytopathology 92: 631-636.</p> <p>Nordskog 2006. Studies on the epidemiology of lettuce downy mildew (Bremia lactucae Regel), including a survey of fungal pathogens in field lettuce (Lactuca sativa L.) in Norway. Philosophiae doctor thesis; 2006:24. Norwegian University of Life Sciences. 123 pp.</p> <p>Mer om salatbladskimmel finner du i <a href="https://www.plantevernleksikonet.no/l/oppslag/487/" target="_blank" rel="noopener">Plantevernleksikonet</a></p> <p>Kontaktperson: <a href="https://nibio.no/ansatte/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p>
statusInterpretation=<p>Rødt \u2014 fare for angrep</p> <p>Grønt \u2014 ingen fare for angrep</p> <p>Grått \u2014 varsel beregnes ikke/modellen ikke er i drift</p> <p>Modellberegninger oppdateres daglig og viser varsler basert på registrerte værdata frem til dagens dato og 2-døgns værprognoser.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* TX - Maximum temperature in deg Celcius\n* BTg - Leaf wetness (Minutes/hour) in grass. Regular leaf wetness can be used as a replacement. \n* Q0 - Solar radiation (W/m^2)\n* UM - relative humidity (%)\n\nThese should all be complete timeseries of hourly data from the same time period.
