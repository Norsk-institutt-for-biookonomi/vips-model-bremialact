name=Lettuce Downy Mildew 
description=<p>This model calculates infection risk of lettuce downy mildew (Bremia lactucae) using weather data and forecasts. The model is of relevance for field grown lettuce.</p> <p>In Norway, lettuce downy mildew usually appears in late summer at days with high moisture and dew formation, but not annually in all lettuce producing regions. Management strategies should therefore be based on an assessment of present inoculum, in addition to the issued risk alerts.</p> <p>{{filename="/images/salatbladskimmel.jpg" description="Lettuce downy mildew in iceberg lettuce. (Photo: Erling Fløistad, NIBIO) "}}<br/> {{filename="/images/salatbladskimmel_2.jpg" description="Lettuce downy mildew in iceberg lettuce. (Photo: Erling Fløistad, NIBIO) "}}<br/> <em>Lettuce downy mildew in iceberg lettuce. (Photo: Erling Fl&oslash;istad, NIBIO)</em></p> <p>The VIPS model for lettuce downy mildew is based on the biology of <em>Bremia lactucae</em> and its response to different weather conditions. Risk events are calculated from hourly values of relative humidity, leaf moisture, temperature and global radiation. Leaf moisture is measured at ground level (30cm) where available, while sensors at 2 m is the secondary option. In Norway, weather data is obtained from weather stations affiliated with the Agrometeorological service (<a href="https://lmt.nibio.no" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste</a> (LMT)) and from 2-day forecasts by the <a href="https://met.no">Norwegian Meteorological Institute</a>.</p> <p>The model calculates whether there are conditions for sporulation, infection and possibly failed infection.</p> <p>Sporulation events depend on high relative humidity (&ge; 93%) for at least 4 hours at night. Spores are released at sunrise and dispersed by wind and water droplets. The onset of an infection will depend on free water on the leaf surface, requiring at least 3 consecutive hours of leaf wetness the following day/night. A red alert for high risk of infection is issued when all criteria for sporulation and infection is fulfilled. High temperatures (&gt; 27&deg;C) will inhibit the pathogens ability to sporulate, thus eliminating a potential risk alert the following night.</p> <p>Short periods of leaf wetness (less than 3 hours) may cause the spores to germinate and die. This triggers a failed infection, and potential risk alerts are cancelled. This will apply also if a longer period of leaf wetness should occur later the same day or following night.</p> <h2>Interpretation of warnings</h2> <p>An infection event triggers a red alert (high infection risk), provided that inoculum and susceptible host plants are present in the area.</p> <p>Model calculations are updated daily, based on observed weather data to present time and 2-day weather forecasts.</p> <p>{{filename="/images/chart_BREMIALACT.png" description="Screenshot from detailed view for lettuce downy mildew risk alerts. The graph displays the temperature threshold for infection (yellow horizontal line) and the recorded maximum temperature. Bars reflect when different criteria for sporulation and infection are fulfilled. Background color is green when no risk is calculated, and red when risk alerts are issued."}}<br/> <em>Screenshot from detailed view for lettuce downy mildew risk alerts. The graph displays the temperature threshold for infection (yellow horizontal line) and the recorded maximum temperature. Bars reflect when different criteria for sporulation and infection are fulfilled. Background color is green when no risk is calculated, and red when risk alerts are issued.</em></p> <h2>Season of model operation</h2> <p>Risk alerts are issued from weather stations located in areas with lettuce production. The model is active from June through September. Please contact VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) if there&rsquo;s a wish for model calculations at additional weather stations, or a need for adjustments of the operating period. Risk alerts for all activated weather stations are automatically displayed at VIPSweb front page map. A private setup with individually selected start and stop dates is available by use of private weather stations and weather stations affiliated with the LMT-network. See <a href="https://www.vips-landbruk.no/information/27/" target="_blank" rel="noopener">user guide</a>. </p> <h2>Test and validation of the model</h2> <p>The model available in VIPS is adapted to Norwegian conditions based on a model originally developed for lettuce producers in California (Scherm &amp; van Bruggen, 1994, 1995), Modell-Analys which was adapted for use in Sweden (Forsberg, 2000), and further studies in California (Wu et al, 2002).</p> <p>Throughout 2001-2005, the model was tested and adapted to Norwegian conditions and have been available in VIPS since 2005. Trial results proved good correlation between spore catch and calculated sporulation events (78 % correct ) based on 59 days with spore traps in fields with active downy mildew infections. This work was part of a PhD-thesis (Nordskog 2006).</p> <h2>Recommendations for model use</h2> <p>When risk alerts are issued, the potential need for treatments should be based on the infection pressure and timing of previous treatments. Contact your local agricultural advisor for details on current plant protection strategies.</p> <h2>References</h2> <p>Forsberg, A. 2000. Prognossystem f&ouml;r behovsanpassad bek&auml;mpning av sallatsbladm&ouml;gel. [Forecasting systems for timing fungicide treatments of downy mildew in lettuce]. (In Swedish, English summary). &ndash; V&auml;xtskyddsnotiser 64: 44-47.</p> <p>Scherm, H. &amp; van Bruggen, A.H.C. 1994. Weather variables associated with infection of lettuce by downy mildew (Bremia lactucae) in Coastal California. &ndash; Phytopathology 84: 860- 865.</p> <p>Scherm, H. &amp; van Bruggen, A.H.C. 1995. Concurrent spore release and infection by Bremia lactucae during mornings with prolonged leaf wetness. &ndash; Phytopathology 85: 552-555.</p> <p>Wu, B.M., van Bruggen, A.H.C., Subbarao, K.U. &amp; Scherm. H. 2002. Incorporation of temperature and solar radiation thresholds to modify a lettuce downy mildew warning system. &ndash; Phytopathology 92: 631-636.</p> <p>Nordskog 2006. Studies on the epidemiology of lettuce downy mildew (Bremia lactucae Regel), including a survey of fungal pathogens in field lettuce (Lactuca sativa L.) in Norway. Philosophiae doctor thesis; 2006:24. Norwegian University of Life Sciences. 123 pp.</p> <p>Lettuce downy mildew description: <a href="https://www.plantevernleksikonet.no/l/oppslag/487/" target="_blank" rel="noopener">Plantevernleksikonet </a></p> <p>Contact person: <a href="https://nibio.no/en/employees/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p>
statusInterpretation=<p>Red &ndash; high risk of infection</p> <p>Green &ndash; no risk of infection</p> <p>Grey - no calculations available/model is not operative</p> <p>Model calculations are updated daily, based on observed weather data to present time and 2-day weather forecasts.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* TX - Maximum temperature in deg Celcius\n* BTg - Leaf wetness (Minutes/hour) in grass. Regular leaf wetness can be used as a replacement. \n* Q0 - Solar radiation (W/m^2)\n* UM - relative humidity (%)\n\nThese should all be complete timeseries of hourly data from the same time period.
