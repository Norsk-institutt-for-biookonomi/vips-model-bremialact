usage=Description of required input parameters:\n\nstartDateAscosporeMaturity - The date for when to start calculation of ascospore maturity. It normally coincides with the date for "Green tip" (See description of model)\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* TX - Maximum temperature in deg Celcius\n* BTg - Leaf wetness (Minutes/hour) in grass. Regular leaf wetness can be used as a replacement. \n* Q0 - Solar radiation (w/m^2)\n* UM - relative humidity (%)\n\nThese should all be complete timeseries of hourly data from the same time period.\n
